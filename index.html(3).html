<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘의 할 일</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#1f2433;--sub:#6b7285;--line:#e4e7ef;--primary:#4f6df5;--study:#e8eeff;--studyt:#3452d6;--life:#e6f7ee;--lifet:#1b7f4b;--danger:#d64545;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161d;--card:#1e212b;--text:#eceef5;--sub:#9aa1b5;--line:#2e3240;--primary:#7b91ff;--study:#26305a;--studyt:#a9b9ff;--life:#1c3a2b;--lifet:#7fdcaa;--danger:#ff7a7a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14161d;--card:#1e212b;--text:#eceef5;--sub:#9aa1b5;--line:#2e3240;--primary:#7b91ff;--study:#26305a;--studyt:#a9b9ff;--life:#1c3a2b;--lifet:#7fdcaa;--danger:#ff7a7a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:24px;margin:8px 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.datebar{display:flex;align-items:center;gap:8px}
.datebar input{flex:1;min-width:0}
button,input,select{font:inherit;color:var(--text)}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px}
button.primary{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats b{display:block;font-size:24px}
.stats span{font-size:12px;color:var(--sub)}
.bar{height:8px;background:var(--line);border-radius:99px;margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--primary);transition:width .25s}
.add{display:flex;gap:8px;flex-wrap:wrap}
.add input[type=text]{flex:1 1 180px}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tabs button{border-radius:99px;font-size:14px;padding:6px 14px}
.tabs button.on{background:var(--primary);border-color:var(--primary);color:#fff}
.tabs .sp{flex:1}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
li:last-child{border-bottom:0}
li input[type=checkbox]{width:20px;height:20px;accent-color:var(--primary);flex:none}
li .t{flex:1;min-width:0;word-break:break-word}
li.done .t{text-decoration:line-through;color:var(--sub)}
li .edit{flex:1;min-width:0}
.tag{font-size:12px;border-radius:99px;padding:2px 9px;flex:none}
.tag.study{background:var(--study);color:var(--studyt)}
.tag.life{background:var(--life);color:var(--lifet)}
.ic{padding:4px 8px;font-size:13px}
.ic.del{color:var(--danger)}
.empty{text-align:center;color:var(--sub);padding:22px 0}
.sec{font-size:13px;color:var(--sub);margin:6px 0 2px}
</style>
</head>
<body>
<div class="wrap">
  <h1>📝 오늘의 할 일</h1>

  <div class="card datebar">
    <button id="prev" aria-label="이전 날">◀</button>
    <input type="date" id="date">
    <button id="next" aria-label="다음 날">▶</button>
    <button id="today">오늘</button>
  </div>

  <div class="card">
    <div class="stats">
      <div><b id="sTotal">0</b><span>전체</span></div>
      <div><b id="sDone">0</b><span>완료</span></div>
      <div><b id="sLeft">0</b><span>남은 일</span></div>
    </div>
    <div class="bar"><i id="prog"></i></div>
  </div>

  <div class="card add">
    <input type="text" id="text" placeholder="할 일을 입력하세요" maxlength="100">
    <select id="cat"><option value="study">학업</option><option value="life">일상</option></select>
    <button class="primary" id="addBtn">추가</button>
  </div>

  <div class="card">
    <div class="tabs" id="tabs">
      <button data-f="all" class="on">전체</button>
      <button data-f="todo">진행</button>
      <button data-f="done">완료</button>
      <span class="sp"></span>
      <select id="catFilter" aria-label="카테고리 필터"><option value="all">모든 카테고리</option><option value="study">학업</option><option value="life">일상</option></select>
    </div>
    <div id="list"></div>
  </div>
</div>

<script>
(function(){
  var KEY="todo-app-v1", CATS={study:"학업",life:"일상"};
  var tasks=[], filter="all", catFilter="all", editing=null;
  try{ tasks=JSON.parse(localStorage.getItem(KEY))||[]; }catch(e){ tasks=[]; }
  function save(){ try{ localStorage.setItem(KEY,JSON.stringify(tasks)); }catch(e){} }
  function fmt(d){ var m=d.getMonth()+1,day=d.getDate(); return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(day<10?"0":"")+day; }
  function shift(s,n){ var p=s.split("-"); var d=new Date(+p[0],+p[1]-1,+p[2]+n); return fmt(d); }
  var $=function(id){return document.getElementById(id)};
  var dateEl=$("date"); dateEl.value=fmt(new Date());

  function render(){
    var day=tasks.filter(function(t){return t.date===dateEl.value});
    var done=day.filter(function(t){return t.done}).length;
    $("sTotal").textContent=day.length; $("sDone").textContent=done; $("sLeft").textContent=day.length-done;
    $("prog").style.width=(day.length?Math.round(done/day.length*100):0)+"%";
    var shown=day.filter(function(t){
      return (filter==="all"||(filter==="done")===t.done) && (catFilter==="all"||t.cat===catFilter);
    });
    var box=$("list"); box.innerHTML="";
    if(!shown.length){ var e=document.createElement("div"); e.className="empty"; e.textContent=day.length?"조건에 맞는 할 일이 없어요":"이 날의 할 일이 없어요. 하나 추가해 보세요!"; box.appendChild(e); return; }
    if(filter==="all"){
      group("진행 중",shown.filter(function(t){return !t.done}),box);
      group("완료",shown.filter(function(t){return t.done}),box);
    } else group(null,shown,box);
  }
  function group(title,items,box){
    if(!items.length) return;
    if(title){ var h=document.createElement("div"); h.className="sec"; h.textContent=title+" ("+items.length+")"; box.appendChild(h); }
    var ul=document.createElement("ul");
    items.forEach(function(t){ ul.appendChild(row(t)); });
    box.appendChild(ul);
  }
  function btn(label,cls,fn){ var b=document.createElement("button"); b.className="ic "+cls; b.textContent=label; b.onclick=fn; return b; }
  function row(t){
    var li=document.createElement("li"); if(t.done) li.className="done";
    var cb=document.createElement("input"); cb.type="checkbox"; cb.checked=t.done;
    cb.onchange=function(){ t.done=cb.checked; save(); render(); };
    li.appendChild(cb);
    var tag=document.createElement("span"); tag.className="tag "+t.cat; tag.textContent=CATS[t.cat]; li.appendChild(tag);
    if(editing===t.id){
      var inp=document.createElement("input"); inp.className="edit"; inp.value=t.text; inp.maxLength=100;
      var commit=function(){ var v=inp.value.trim(); if(v) t.text=v; editing=null; save(); render(); };
      inp.onkeydown=function(e){ if(e.key==="Enter") commit(); if(e.key==="Escape"){ editing=null; render(); } };
      li.appendChild(inp);
      li.appendChild(btn("저장","",commit));
      setTimeout(function(){inp.focus();},0);
    } else {
      var s=document.createElement("span"); s.className="t"; s.textContent=t.text; li.appendChild(s);
      li.appendChild(btn("수정","",function(){ editing=t.id; render(); }));
      li.appendChild(btn("삭제","del",function(){ tasks=tasks.filter(function(x){return x.id!==t.id}); save(); render(); }));
    }
    return li;
  }
  function add(){
    var v=$("text").value.trim(); if(!v){ $("text").focus(); return; }
    tasks.push({id:Date.now()+Math.random(),date:dateEl.value,text:v,cat:$("cat").value,done:false});
    $("text").value=""; save(); render(); $("text").focus();
  }
  $("addBtn").onclick=add;
  $("text").onkeydown=function(e){ if(e.key==="Enter") add(); };
  dateEl.onchange=function(){ if(!dateEl.value) dateEl.value=fmt(new Date()); editing=null; render(); };
  $("prev").onclick=function(){ dateEl.value=shift(dateEl.value,-1); render(); };
  $("next").onclick=function(){ dateEl.value=shift(dateEl.value,1); render(); };
  $("today").onclick=function(){ dateEl.value=fmt(new Date()); render(); };
  $("catFilter").onchange=function(e){ catFilter=e.target.value; render(); };
  $("tabs").onclick=function(e){
    var f=e.target.getAttribute("data-f"); if(!f) return;
    filter=f; Array.prototype.forEach.call($("tabs").querySelectorAll("button"),function(b){ b.classList.toggle("on",b===e.target); });
    render();
  };
  render();
})();
</script>
</body>
</html>
