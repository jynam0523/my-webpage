<!DOCTYPE html>
<html lang="ko" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MindQuote - 마음을 채우는 감정 맞춤 명언</title>

    <!-- PWA / App-like Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#FAF5FF">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Gowun Batang & Noto Sans KR) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        joy: { light: '#FFFBEB', badge: '#FEF3C7', border: '#FCD34D', text: '#D97706', accent: '#F59E0B' },
                        sad: { light: '#F0F9FF', badge: '#E0F2FE', border: '#7DD3FC', text: '#0369A1', accent: '#0284C7' },
                        burnout: { light: '#FEF2F2', badge: '#FEE2E2', border: '#FCA5A5', text: '#B91C1C', accent: '#EF4444' },
                        anxiety: { light: '#FAF5FF', badge: '#F3E8FF', border: '#D8B4FE', text: '#6B21A8', accent: '#9333EA' }
                    },
                    fontFamily: {
                        sans: ['Noto Sans KR', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
                        serif: ['Gowun Batang', 'serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* Mobile Touch & Layout Optimizations */
        * {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #F8FAFC;
            overscroll-behavior-y: none;
        }
        .quote-font {
            font-family: 'Gowun Batang', serif;
            word-break: keep-all;
        }
        
        /* Card Animations */
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.95) translateY(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .animate-pop {
            animation: popIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Custom Scrollbar */
        .custom-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #E2E8F0;
            border-radius: 9999px;
        }

        /* Safe area support for iOS notches */
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom, 1rem);
        }
    </style>
</head>
<body class="h-full flex flex-col justify-between text-gray-800 antialiased overflow-x-hidden">

    <!-- Toast Notification (Float Top) -->
    <div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 transform -translate-y-20 opacity-0 transition-all duration-300 ease-out w-[90%] max-w-sm bg-gray-900/95 text-white px-4 py-3 rounded-2xl shadow-xl flex items-center space-x-3 pointer-events-none backdrop-blur-md">
        <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400 text-lg"></i>
        <span id="toastMsg" class="text-xs sm:text-sm font-medium">메시지 내용</span>
    </div>

    <!-- Mobile Top Navigation Header -->
    <header class="w-full bg-white/80 backdrop-blur-md border-b border-gray-100 sticky top-0 z-30">
        <div class="max-w-md mx-auto px-4 h-14 flex items-center justify-between">
            <div class="flex items-center space-x-2.5 cursor-pointer active:opacity-70 transition" onclick="resetToHome()">
                <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-amber-400 via-rose-400 to-indigo-500 flex items-center justify-center text-white font-bold text-sm shadow-sm">
                    <i class="fa-solid fa-heart"></i>
                </div>
                <span class="text-lg font-bold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-gray-900 to-gray-600">MindQuote</span>
            </div>
            
            <div class="flex items-center space-x-1">
                <!-- Header Actions -->
                <button onclick="openBookmarkModal()" class="p-2.5 rounded-full text-gray-600 hover:text-amber-500 hover:bg-amber-50 active:bg-amber-100 transition relative" title="보관함">
                    <i class="fa-regular fa-bookmark text-lg"></i>
                    <span id="bookmarkBadge" class="absolute top-1.5 right-1.5 bg-amber-500 text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold">0</span>
                </button>
                <button onclick="openManageModal()" class="p-2.5 rounded-full text-gray-600 hover:text-indigo-600 hover:bg-indigo-50 active:bg-indigo-100 transition" title="명언 관리">
                    <i class="fa-solid fa-sliders text-lg"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Mobile Container -->
    <main class="flex-grow max-w-md w-full mx-auto px-4 py-6 flex flex-col justify-center items-center">

        <!-- Header Title Section -->
        <div id="titleSection" class="text-center mb-6">
            <span class="px-3 py-1 bg-indigo-50 text-indigo-600 rounded-full text-[11px] font-semibold tracking-wider uppercase inline-block mb-2">20대 마음 백신 글귀</span>
            <h1 class="text-xl sm:text-2xl font-bold text-gray-900 tracking-tight">지금 당신의 감정은 어떤가요?</h1>
            <p class="text-gray-400 text-xs sm:text-sm mt-1">버튼을 누르면 딱 맞는 격려의 명언을 건네드립니다.</p>
        </div>

        <!-- 4 Major Emotion Selector Grid -->
        <div class="w-full grid grid-cols-2 gap-3 mb-6">
            <!-- Joy -->
            <button onclick="selectEmotion('joy')" id="btn-joy" class="emotion-btn group p-4 rounded-2xl border border-gray-100 bg-white shadow-sm hover:shadow-md active:scale-95 transition-all duration-200 text-left flex flex-col justify-between relative overflow-hidden">
                <div class="w-9 h-9 rounded-xl bg-amber-100 text-amber-600 flex items-center justify-center text-lg mb-2 group-hover:scale-110 transition-transform">
                    😊
                </div>
                <div>
                    <h3 class="font-bold text-gray-800 text-sm group-hover:text-amber-600 transition">기쁘고 행복함</h3>
                    <p class="text-[11px] text-gray-400 mt-0.5">기쁨을 나누는 순간</p>
                </div>
            </button>

            <!-- Sadness -->
            <button onclick="selectEmotion('sad')" id="btn-sad" class="emotion-btn group p-4 rounded-2xl border border-gray-100 bg-white shadow-sm hover:shadow-md active:scale-95 transition-all duration-200 text-left flex flex-col justify-between relative overflow-hidden">
                <div class="w-9 h-9 rounded-xl bg-sky-100 text-sky-600 flex items-center justify-center text-lg mb-2 group-hover:scale-110 transition-transform">
                    🌧️
                </div>
                <div>
                    <h3 class="font-bold text-gray-800 text-sm group-hover:text-sky-600 transition">슬프고 우울함</h3>
                    <p class="text-[11px] text-gray-400 mt-0.5">조용한 위로의 글귀</p>
                </div>
            </button>

            <!-- Burnout -->
            <button onclick="selectEmotion('burnout')" id="btn-burnout" class="emotion-btn group p-4 rounded-2xl border border-gray-100 bg-white shadow-sm hover:shadow-md active:scale-95 transition-all duration-200 text-left flex flex-col justify-between relative overflow-hidden">
                <div class="w-9 h-9 rounded-xl bg-rose-100 text-rose-600 flex items-center justify-center text-lg mb-2 group-hover:scale-110 transition-transform">
                    🔋
                </div>
                <div>
                    <h3 class="font-bold text-gray-800 text-sm group-hover:text-rose-600 transition">지치고 번아웃</h3>
                    <p class="text-[11px] text-gray-400 mt-0.5">쉼이 필요한 당신에게</p>
                </div>
            </button>

            <!-- Anxiety -->
            <button onclick="selectEmotion('anxiety')" id="btn-anxiety" class="emotion-btn group p-4 rounded-2xl border border-gray-100 bg-white shadow-sm hover:shadow-md active:scale-95 transition-all duration-200 text-left flex flex-col justify-between relative overflow-hidden">
                <div class="w-9 h-9 rounded-xl bg-purple-100 text-purple-600 flex items-center justify-center text-lg mb-2 group-hover:scale-110 transition-transform">
                    💭
                </div>
                <div>
                    <h3 class="font-bold text-gray-800 text-sm group-hover:text-purple-600 transition">불안하고 스트레스</h3>
                    <p class="text-[11px] text-gray-400 mt-0.5">마음의 평정 되찾기</p>
                </div>
            </button>
        </div>

        <!-- Dynamic Quote Card Display -->
        <div id="quoteCardArea" class="w-full hidden min-h-[300px] flex flex-col justify-between bg-white rounded-3xl p-6 shadow-xl border border-gray-100 relative overflow-hidden transition-all duration-300">
            <!-- Background Decorative Quote Icon -->
            <div class="absolute -right-2 -bottom-4 text-gray-100 font-serif text-9xl pointer-events-none select-none opacity-80">“</div>
            
            <div class="relative z-10 flex justify-between items-center mb-4">
                <span id="emotionBadge" class="px-3 py-1 rounded-full text-[11px] font-bold tracking-wide uppercase">
                    감정 카테고리
                </span>
                <div class="flex items-center space-x-1">
                    <button id="btnBookmark" onclick="toggleBookmarkCurrent()" title="보관함 저장" class="w-9 h-9 rounded-full border border-gray-200 flex items-center justify-center text-gray-400 hover:text-amber-500 active:scale-90 transition">
                        <i id="bookmarkIcon" class="fa-regular fa-bookmark text-base"></i>
                    </button>
                    <button onclick="copyQuoteToClipboard()" title="클립보드 복사" class="w-9 h-9 rounded-full border border-gray-200 flex items-center justify-center text-gray-400 hover:text-indigo-600 active:scale-90 transition">
                        <i class="fa-regular fa-copy text-base"></i>
                    </button>
                </div>
            </div>

            <!-- Quote Text View -->
            <div id="quoteContentContainer" class="relative z-10 my-auto py-4">
                <p id="quoteText" class="quote-font text-xl sm:text-2xl text-gray-800 leading-relaxed font-bold text-center mb-4">
                    "여기에 선택된 명언 문장이 출력됩니다."
                </p>
                <div id="quoteAuthor" class="text-right text-gray-500 font-medium text-xs sm:text-sm italic">
                    - 발언자 / 출처 -
                </div>
            </div>

            <!-- Action Controls -->
            <div class="relative z-10 mt-6 pt-4 border-t border-gray-100 flex items-center justify-between">
                <span class="text-[11px] text-gray-400 font-medium">카테고리 총 <span id="categoryCount" class="font-bold text-gray-600">0</span>개 명언</span>
                <button onclick="showNextRandomQuote()" class="px-5 py-2.5 bg-gray-900 active:bg-gray-800 text-white text-xs font-semibold rounded-xl shadow-md active:scale-95 transition flex items-center space-x-2">
                    <i class="fa-solid fa-rotate-right text-xs"></i>
                    <span>다른 명언 보기</span>
                </button>
            </div>
        </div>

        <!-- Initial Placeholder State -->
        <div id="emptyState" class="w-full bg-white/70 border border-dashed border-gray-300 rounded-3xl p-8 text-center text-gray-400">
            <i class="fa-solid fa-heart-pulse text-3xl mb-3 text-indigo-300 animate-pulse"></i>
            <p class="text-xs sm:text-sm font-medium text-gray-600">위의 4가지 감정 버튼 중 하나를 선택해 보세요.</p>
            <p class="text-[11px] text-gray-400 mt-1">당신의 마음에 꼭 알맞은 한 줄의 문장을 선물합니다.</p>
        </div>
    </main>

    <!-- Footer Area -->
    <footer class="w-full text-center py-4 text-[11px] text-gray-400 border-t border-gray-100 bg-white/50 pb-safe">
        <p>© 2026 MindQuote. 20대를 위한 감정 케어 웹앱</p>
    </footer>

    <!-- Modal 1: Quote Management (명언 목록 관리) -->
    <div id="manageModal" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-3xl max-h-[90vh] flex flex-col shadow-2xl overflow-hidden animate-pop">
            <!-- Header -->
            <div class="p-4 border-b border-gray-100 flex items-center justify-between bg-gray-50">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-sliders text-indigo-600"></i>
                    <h2 class="text-base font-bold text-gray-800">명언 목록 및 관리자 설정</h2>
                </div>
                <button onclick="closeManageModal()" class="text-gray-400 hover:text-gray-600 w-8 h-8 rounded-full flex items-center justify-center">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <!-- Filter & Add Button Bar -->
            <div class="p-3 border-b border-gray-100 flex items-center justify-between gap-2 overflow-x-auto">
                <div class="flex space-x-1 bg-gray-100 p-1 rounded-xl text-[11px] font-semibold flex-shrink-0">
                    <button onclick="filterManageCategory('all')" id="tab-all" class="manage-tab px-2.5 py-1 rounded-lg bg-white shadow-sm text-gray-800">전체 (<span id="cnt-all">0</span>)</button>
                    <button onclick="filterManageCategory('joy')" id="tab-joy" class="manage-tab px-2.5 py-1 rounded-lg text-gray-500">기쁨 (<span id="cnt-joy">0</span>)</button>
                    <button onclick="filterManageCategory('sad')" id="tab-sad" class="manage-tab px-2.5 py-1 rounded-lg text-gray-500">슬픔 (<span id="cnt-sad">0</span>)</button>
                    <button onclick="filterManageCategory('burnout')" id="tab-burnout" class="manage-tab px-2.5 py-1 rounded-lg text-gray-500">번아웃 (<span id="cnt-burnout">0</span>)</button>
                    <button onclick="filterManageCategory('anxiety')" id="tab-anxiety" class="manage-tab px-2.5 py-1 rounded-lg text-gray-500">불안 (<span id="cnt-anxiety">0</span>)</button>
                </div>
                
                <button onclick="toggleAddForm()" class="flex-shrink-0 px-3 py-1.5 bg-indigo-600 active:bg-indigo-700 text-white rounded-xl text-xs font-semibold flex items-center space-x-1 shadow-sm">
                    <i class="fa-solid fa-plus text-[10px]"></i>
                    <span>명언 추가</span>
                </button>
            </div>

            <!-- Add Quote Form (Collapsible) -->
            <div id="addQuoteForm" class="hidden p-4 bg-indigo-50/70 border-b border-indigo-100">
                <h3 class="text-xs font-bold text-indigo-900 mb-2.5 flex items-center space-x-1">
                    <i class="fa-solid fa-pen"></i>
                    <span>새 명언 등록</span>
                </h3>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5 mb-2.5">
                    <div>
                        <label class="block text-[11px] font-medium text-gray-600 mb-1">감정 카테고리</label>
                        <select id="inputCategory" class="w-full text-xs p-2 rounded-xl border border-gray-300 focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
                            <option value="joy">기쁘고 행복함</option>
                            <option value="sad">슬프고 우울함</option>
                            <option value="burnout">지치고 번아웃</option>
                            <option value="anxiety">불안하고 스트레스</option>
                        </select>
                    </div>
                    <div class="sm:col-span-2">
                        <label class="block text-[11px] font-medium text-gray-600 mb-1">발언자 / 출처</label>
                        <input type="text" id="inputAuthor" placeholder="예: 랄프 왈도 에머슨" class="w-full text-xs p-2 rounded-xl border border-gray-300 focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="block text-[11px] font-medium text-gray-600 mb-1">명언 내용</label>
                    <textarea id="inputText" rows="2" placeholder="격려와 위로가 되는 글귀를 입력하세요." class="w-full text-xs p-2 rounded-xl border border-gray-300 focus:ring-2 focus:ring-indigo-500 outline-none bg-white"></textarea>
                </div>
                <div class="flex justify-end space-x-2">
                    <button onclick="toggleAddForm()" class="px-3 py-1.5 text-xs text-gray-500 hover:text-gray-700">취소</button>
                    <button onclick="saveNewQuote()" class="px-4 py-1.5 bg-indigo-600 text-white rounded-xl text-xs font-semibold active:bg-indigo-700 shadow-sm">저장하기</button>
                </div>
            </div>

            <!-- Quote List -->
            <div id="manageQuoteList" class="p-4 overflow-y-auto custom-scroll flex-grow space-y-2.5">
                <!-- Dynamic List Items -->
            </div>

            <!-- Footer Reset Action -->
            <div class="p-3 border-t border-gray-100 bg-gray-50 flex justify-between items-center text-[11px] text-gray-500 pb-safe">
                <span>데이터 원복이 필요한 경우</span>
                <button onclick="resetDefaultQuotes()" class="text-rose-500 font-medium hover:underline">기본 80개로 초기화</button>
            </div>
        </div>
    </div>

    <!-- Modal 2: Bookmarks (보관함) -->
    <div id="bookmarkModal" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-3xl max-h-[85vh] flex flex-col shadow-2xl overflow-hidden animate-pop">
            <div class="p-4 border-b border-gray-100 flex items-center justify-between bg-amber-50/60">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-bookmark text-amber-500"></i>
                    <h2 class="text-base font-bold text-gray-800">마음 보관함</h2>
                </div>
                <button onclick="closeBookmarkModal()" class="text-gray-400 hover:text-gray-600 w-8 h-8 rounded-full flex items-center justify-center">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <div id="bookmarkList" class="p-4 overflow-y-auto custom-scroll flex-grow space-y-2.5 pb-safe">
                <!-- Dynamic Saved Items -->
            </div>
        </div>
    </div>

    <!-- App JavaScript Logic -->
    <script>
        // 80+ Default Curated Quotes Data (20+ per Emotion)
        const DEFAULT_QUOTES = [
            // 1. 기쁘고 행복함 (Joy & Happiness)
            { id: "j1", category: "joy", text: "행복은 이미 완성된 것이 아니라, 당신의 작은 행동에서 비롯되는 것이다.", author: "달라이 라마" },
            { id: "j2", category: "joy", text: "기쁨은 기쁨을 만드는 행위 자체 속에 늘 존재한다.", author: "칼릴 지브란" },
            { id: "j3", category: "joy", text: "미소는 돈 안 들고 즐거움을 전하는 가장 완벽한 방법이다.", author: "톰 홉킨스" },
            { id: "j4", category: "joy", text: "오늘 하루를 감사하게 받아들인다면, 매일이 선물 같은 축제가 된다.", author: "오프라 윈프리" },
            { id: "j5", category: "joy", text: "행복은 나눌수록 배가 되고, 슬픔은 나눌수록 줄어든다.", author: "알베르트 슈바이처" },
            { id: "j6", category: "joy", text: "가장 환하게 웃는 사람이 가장 깊은 감사를 아는 법이다.", author: "에픽테토스" },
            { id: "j7", category: "joy", text: "우리가 느끼는 행복의 크기는 우리의 마음가짐에 정확히 비례한다.", author: "에이브러햄 링컨" },
            { id: "j8", category: "joy", text: "지금 이 순간 순수한 즐거움을 느끼는 것, 그것이 삶의 목적이다.", author: "월트 디즈니" },
            { id: "j9", category: "joy", text: "당신이 행복하기로 마음먹은 순간, 온 세상도 당신과 함께 웃는다.", author: "헤르만 헤세" },
            { id: "j10", category: "joy", text: "삶에서 가장 큰 행복은 사랑하고 또 사랑받는 일이다.", author: "빅토르 위고" },
            { id: "j11", category: "joy", text: "햇살이 모두를 비추듯, 기쁨도 당신 마음에 머물 준비가 되어 있다.", author: "파울로 코엘료" },
            { id: "j12", category: "joy", text: "작은 일에 솔직하게 기뻐할 줄 아는 사람이 커다란 행복을 소유한다.", author: "프리드리히 니체" },
            { id: "j13", category: "joy", text: "웃음은 두 사람 사이를 가장 가깝게 잇는 단편의 다리다.", author: "빅토르 보르게" },
            { id: "j14", category: "joy", text: "행복이란 생각하고, 말하고, 행하는 것이 완전한 조화를 이룰 때 찾아온다.", author: "마하트마 간디" },
            { id: "j15", category: "joy", text: "좋은 하루는 따뜻한 생각에서 시작되고, 행복은 감사하는 마음에서 피어난다.", author: "마르쿠스 아우렐리우스" },

            { id: "b18", category: "burnout", text: "속도보다 중요한 것은 방향이고, 방향보다 중요한 것은 당신의 안녕이다.", author: "스티븐 코비" },

            // 4. 불안하고 스트레스 (Anxiety & Stress)
            { id: "a1", category: "anxiety", text: "우리가 걱정하는 일의 90%는 실제로 일어나지 않는 일이다.", author: "데일 카네기" },
            { id: "a2", category: "anxiety", text: "바람이 강하게 불수록 나무의 뿌리는 땅속 깊이 내려간다.", author: "윈스턴 처칠" },
            { id: "a3", category: "anxiety", text: "지금의 불안은 더 나은 미래를 준비하려는 마음의 자연스러운 반응이다.", author: "롤로 메이" },
            { id: "a4", category: "anxiety", text: "통제할 수 없는 일에 마음 쓰지 말고, 내가 할 수 있는 작은 것에 집중하라.", author: "에픽테토스" },
            { id: "a5", category: "anxiety", text: "깊은 숨을 한번 쉬어보세요. 이 순간만큼은 당신은 완전히 안전합니다.", author: "틱낫한" },
            { id: "a6", category: "anxiety", text: "걱정을 달고 사는 것은 일어나지 않은 일에 이자를 미리 파는 것과 같다.", author: "윌리엄 잉그" },
            { id: "a7", category: "anxiety", text: "두려워하는 그 문을 열면 생각보다 훨씬 평화로운 풍경이 기다린다.", author: "C.S. 루이스" },
            { id: "a8", category: "anxiety", text: "파도가 밀려오는 것을 막을 수는 없지만, 파도를 타는 법은 배울 수 있다.", author: "존 카밧진" },
            { id: "a9", category: "anxiety", text: "지금 당장 답을 구하려 애쓰지 마라. 질문 자체를 품고 살아가다 보면 답에 다다른다.", author: "라이너 마리아 릴케" },
            { id: "a10", category: "anxiety", text: "천천히 가도 괜찮다. 멈추지 않는 한 당신은 반드시 도달한다.", author: "공자" },
            { id: "a11", category: "anxiety", text: "불안은 미래가 만든 환상일 뿐, 지금 이 순간의 현실이 아니다.", author: "세네카" },
            { id: "a12", category: "anxiety", text: "마음의 평정은 상황을 바꿀 때가 아니라 내 시선을 바꿀 때 찾아온다.", author: "마르쿠스 아우렐리우스" },
            { id: "a13", category: "anxiety", text: "스트레스는 외부 환경이 아니라 그 환경을 바라보는 마음에서 시작된다.", author: "한스 세리에" },
            { id: "a14", category: "anxiety", text: "당신은 당신이 생각하는 것보다 훨씬 더 강하고 지혜롭다.", author: "A.A. 밀른" },
            { id: "a15", category: "anxiety", text: "복잡한 생각의 끈을 끊어내세요. 오직 '지금, 여기'에 내 마음을 두세요.", author: "바브라 드 안젤리스" },
            { id: "a16", category: "anxiety", text: "모든 커다란 성취도 결국 조심스러운 한 걸음에서 시작되었다.", author: "노자" },
            { id: "a17", category: "anxiety", text: "남과 비교하는 순간 불안이 피어난다. 어제의 나와 오늘을 비교하라.", author: "조던 피터슨" },
            { id: "a18", category: "anxiety", text: "불안감이 밀려올 때면 내가 이겨냈던 수많은 극복의 순간을 기억하라.", author: "마야 안젤루" },
            { id: "a19", category: "anxiety", text: "흔들리지 않고 피는 꽃이 어디 있으랴. 지금 당신은 예쁘게 피어나는 중이다.", author: "도종환" },
            { id: "a20", category: "anxiety", text: "자연은 결코 서두르지 않지만 모든 것을 완벽히 이루어낸다.", author: "장자" }
        ];

        // Emotion Themes Configuration
        const EMOTIONS = {
            joy: {
                title: '기쁘고 행복함',
                badgeClass: 'bg-amber-100 text-amber-800 border border-amber-300',
                btnClass: 'border-amber-400 bg-amber-50/60 shadow-sm',
                icon: '😊'
            },
            sad: {
                title: '슬프고 우울함',
                badgeClass: 'bg-sky-100 text-sky-800 border border-sky-300',
                btnClass: 'border-sky-400 bg-sky-50/60 shadow-sm',
                icon: '🌧️'
            },
            burnout: {
                title: '지치고 번아웃',
                badgeClass: 'bg-rose-100 text-rose-800 border border-rose-300',
                btnClass: 'border-rose-400 bg-rose-50/60 shadow-sm',
                icon: '🔋'
            },
            anxiety: {
                title: '불안하고 스트레스',
                badgeClass: 'bg-purple-100 text-purple-800 border border-purple-300',
                btnClass: 'border-purple-400 bg-purple-50/60 shadow-sm',
                icon: '💭'
            }
        };

        // Application State
        let quotes = [];
        let bookmarks = [];
        let currentEmotion = null;
        let currentQuote = null;
        let manageFilter = 'all';

        // Load Initial Storage Data
        window.onload = function () {
            loadQuotes();
            loadBookmarks();
        };

        function loadQuotes() {
            const saved = localStorage.getItem('mindquote_data_v2');
            if (saved) {
                try {
                    quotes = JSON.parse(saved);
                } catch(e) {
                    quotes = [...DEFAULT_QUOTES];
                }
            } else {
                quotes = [...DEFAULT_QUOTES];
                saveQuotesToStorage();
            }
        }

        function saveQuotesToStorage() {
            localStorage.setItem('mindquote_data_v2', JSON.stringify(quotes));
        }

        function loadBookmarks() {
            const saved = localStorage.getItem('mindquote_bookmarks_v2');
            if (saved) {
                try {
                    bookmarks = JSON.parse(saved);
                } catch(e) {
                    bookmarks = [];
                }
            }
            updateBookmarkBadge();
        }

        function saveBookmarksToStorage() {
            localStorage.setItem('mindquote_bookmarks_v2', JSON.stringify(bookmarks));
            updateBookmarkBadge();
        }

        function updateBookmarkBadge() {
            const badge = document.getElementById('bookmarkBadge');
            if(badge) badge.innerText = bookmarks.length;
        }

        // Action: Emotion Selection
        function selectEmotion(emotionKey) {
            currentEmotion = emotionKey;

            // Reset buttons styling
            document.querySelectorAll('.emotion-btn').forEach(btn => {
                btn.className = btn.className.replace(/border-\S+/g, 'border-gray-100').replace(/bg-\S+/g, 'bg-white');
            });

            // Highlight selected button
            const selectedBtn = document.getElementById(`btn-${emotionKey}`);
            if(selectedBtn) {
                selectedBtn.classList.remove('border-gray-100', 'bg-white');
                const conf = EMOTIONS[emotionKey];
                selectedBtn.classList.add(...conf.btnClass.split(' '));
            }

            // Hide Initial State & Show Card Area
            document.getElementById('emptyState').classList.add('hidden');
            const cardArea = document.getElementById('quoteCardArea');
            cardArea.classList.remove('hidden');

            showNextRandomQuote();
        }

        // Action: Random Quote Pick (Prevents Consecutive Duplicate)
        function showNextRandomQuote() {
            if (!currentEmotion) return;

            const categoryQuotes = quotes.filter(q => q.category === currentEmotion);
            if (categoryQuotes.length === 0) {
                showToast('해당 카테고리에 명언이 없습니다.', 'error');
                return;
            }

            // Filter out current quote to guarantee random variation if > 1 items
            let available = categoryQuotes;
            if (categoryQuotes.length > 1 && currentQuote) {
                available = categoryQuotes.filter(q => q.id !== currentQuote.id);
            }

            const randomIndex = Math.floor(Math.random() * available.length);
            currentQuote = available[randomIndex];

            // Render Card Content with Animation
            const quoteContentContainer = document.getElementById('quoteContentContainer');
            const emotionBadge = document.getElementById('emotionBadge');
            const quoteText = document.getElementById('quoteText');
            const quoteAuthor = document.getElementById('quoteAuthor');
            const categoryCount = document.getElementById('categoryCount');

            quoteContentContainer.classList.remove('animate-pop');

            setTimeout(() => {
                const conf = EMOTIONS[currentEmotion];
                emotionBadge.className = `px-3 py-1 rounded-full text-[11px] font-bold tracking-wide uppercase ${conf.badgeClass}`;
                emotionBadge.innerText = `${conf.icon} ${conf.title}`;

                quoteText.innerText = `"${currentQuote.text}"`;
                quoteAuthor.innerText = `- ${currentQuote.author} -`;
                categoryCount.innerText = categoryQuotes.length;

                updateBookmarkIconState();
                quoteContentContainer.classList.add('animate-pop');
            }, 50);
        }

        // Toggle Bookmark Status for Current Quote
        function toggleBookmarkCurrent() {
            if (!currentQuote) return;

            const index = bookmarks.findIndex(b => b.id === currentQuote.id);
            if (index > -1) {
                bookmarks.splice(index, 1);
                showToast('보관함에서 삭제되었습니다.', 'info');
            } else {
                bookmarks.push(currentQuote);
                showToast('보관함에 명언을 보관했습니다.', 'success');
            }
            saveBookmarksToStorage();
            updateBookmarkIconState();
        }

        function updateBookmarkIconState() {
            const icon = document.getElementById('bookmarkIcon');
            const btn = document.getElementById('btnBookmark');
            if (!currentQuote || !icon) return;

            const isBookmarked = bookmarks.some(b => b.id === currentQuote.id);
            if (isBookmarked) {
                icon.className = "fa-solid fa-bookmark text-base text-amber-500";
                btn.classList.add('bg-amber-50', 'border-amber-300');
            } else {
                icon.className = "fa-regular fa-bookmark text-base text-gray-400";
                btn.classList.remove('bg-amber-50', 'border-amber-300');
            }
        }

        // Copy Text to Clipboard
        function copyQuoteToClipboard() {
            if (!currentQuote) return;
            const fullText = `"${currentQuote.text}" - ${currentQuote.author} [MindQuote]`;

            const tempInput = document.createElement("textarea");
            tempInput.value = fullText;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand("copy");
            document.body.removeChild(tempInput);

            showToast('클립보드에 명언이 복사되었습니다.', 'success');
        }

        // Reset App State to Home
        function resetToHome() {
            currentEmotion = null;
            currentQuote = null;
            document.getElementById('quoteCardArea').classList.add('hidden');
            document.getElementById('emptyState').classList.remove('hidden');
            document.querySelectorAll('.emotion-btn').forEach(btn => {
                btn.className = btn.className.replace(/border-\S+/g, 'border-gray-100').replace(/bg-\S+/g, 'bg-white');
            });
        }

        // --- MANAGE MODAL FUNCTIONS ---

        function openManageModal() {
            renderManageList();
            document.getElementById('manageModal').classList.remove('hidden');
        }

        function closeManageModal() {
            document.getElementById('manageModal').classList.add('hidden');
            document.getElementById('addQuoteForm').classList.add('hidden');
        }

        function filterManageCategory(catKey) {
            manageFilter = catKey;
            
            document.querySelectorAll('.manage-tab').forEach(tab => {
                tab.className = "manage-tab px-2.5 py-1 rounded-lg text-gray-500";
            });
            const activeTab = document.getElementById(`tab-${catKey}`);
            if(activeTab) {
                activeTab.className = "manage-tab px-2.5 py-1 rounded-lg bg-white shadow-sm font-bold text-indigo-600 border border-gray-200";
            }

            renderManageList();
        }

        function renderManageList() {
            const listEl = document.getElementById('manageQuoteList');
            listEl.innerHTML = '';

            // Update Counts
            document.getElementById('cnt-all').innerText = quotes.length;
            document.getElementById('cnt-joy').innerText = quotes.filter(q=>q.category==='joy').length;
            document.getElementById('cnt-sad').innerText = quotes.filter(q=>q.category==='sad').length;
            document.getElementById('cnt-burnout').innerText = quotes.filter(q=>q.category==='burnout').length;
            document.getElementById('cnt-anxiety').innerText = quotes.filter(q=>q.category==='anxiety').length;

            const filtered = manageFilter === 'all' ? quotes : quotes.filter(q => q.category === manageFilter);

            if (filtered.length === 0) {
                listEl.innerHTML = `
                    <div class="text-center py-8 text-gray-400 text-xs">
                        등록된 명언이 없습니다.
                    </div>
                `;
                return;
            }

            filtered.forEach(q => {
                const conf = EMOTIONS[q.category] || EMOTIONS['joy'];
                const item = document.createElement('div');
                item.className = "p-3 bg-gray-50 rounded-2xl border border-gray-200 flex items-start justify-between space-x-2";
                item.innerHTML = `
                    <div class="flex-grow min-w-0">
                        <div class="flex items-center space-x-1.5 mb-1">
                            <span class="px-2 py-0.5 rounded text-[10px] font-bold ${conf.badgeClass}">${conf.icon} ${conf.title}</span>
                            <span class="text-xs font-bold text-gray-700 truncate">- ${escapeHtml(q.author)}</span>
                        </div>
                        <p class="text-xs text-gray-600 quote-font line-clamp-2">"${escapeHtml(q.text)}"</p>
                    </div>
                    <button onclick="deleteQuote('${q.id}')" title="삭제" class="text-gray-400 hover:text-rose-500 p-1.5 rounded-lg active:bg-gray-200 transition">
                        <i class="fa-regular fa-trash-can text-sm"></i>
                    </button>
                `;
                listEl.appendChild(item);
            });
        }

        function toggleAddForm() {
            const form = document.getElementById('addQuoteForm');
            form.classList.toggle('hidden');
        }

        function saveNewQuote() {
            const category = document.getElementById('inputCategory').value;
            const author = document.getElementById('inputAuthor').value.trim();
            const text = document.getElementById('inputText').value.trim();

            if (!author || !text) {
                showToast('출처와 명언 내용을 입력해주세요.', 'error');
                return;
            }

            const newQuote = {
                id: 'custom_' + Date.now(),
                category: category,
                author: author,
                text: text
            };

            quotes.unshift(newQuote);
            saveQuotesToStorage();

            document.getElementById('inputAuthor').value = '';
            document.getElementById('inputText').value = '';
            toggleAddForm();
            renderManageList();
            showToast('새 명언이 등록되었습니다.', 'success');
        }

        function deleteQuote(id) {
            quotes = quotes.filter(q => q.id !== id);
            bookmarks = bookmarks.filter(b => b.id !== id);
            saveQuotesToStorage();
            saveBookmarksToStorage();
            renderManageList();

            if (currentQuote && currentQuote.id === id) {
                showNextRandomQuote();
            }

            showToast('명언이 삭제되었습니다.', 'info');
        }

        function resetDefaultQuotes() {
            if (confirm("모든 사용자 추가/삭제 내역을 리셋하고 기본 80개 명언으로 원복하시겠습니까?")) {
                quotes = [...DEFAULT_QUOTES];
                saveQuotesToStorage();
                renderManageList();
                showToast('기본 명언 목록으로 복원되었습니다.', 'success');
            }
        }

        // --- BOOKMARK MODAL FUNCTIONS ---

        function openBookmarkModal() {
            renderBookmarkList();
            document.getElementById('bookmarkModal').classList.remove('hidden');
        }

        function closeBookmarkModal() {
            document.getElementById('bookmarkModal').classList.add('hidden');
        }

        function renderBookmarkList() {
            const listEl = document.getElementById('bookmarkList');
            listEl.innerHTML = '';

            if (bookmarks.length === 0) {
                listEl.innerHTML = `
                    <div class="text-center py-10 text-gray-400 text-xs">
                        <i class="fa-regular fa-bookmark text-3xl mb-2 text-amber-200"></i>
                        <p class="font-medium text-gray-500">보관된 명언이 없습니다.</p>
                        <p class="mt-0.5 text-gray-400">마음에 드는 글귀의 북마크 아이콘을 눌러보세요.</p>
                    </div>
                `;
                return;
            }

            bookmarks.forEach(b => {
                const conf = EMOTIONS[b.category] || EMOTIONS['joy'];
                const item = document.createElement('div');
                item.className = "p-3.5 bg-amber-50/50 rounded-2xl border border-amber-100 flex items-start justify-between space-x-2";
                item.innerHTML = `
                    <div class="flex-grow">
                        <span class="px-2 py-0.5 rounded text-[10px] font-bold ${conf.badgeClass}">${conf.icon} ${conf.title}</span>
                        <p class="text-xs font-semibold text-gray-800 quote-font mt-2 mb-1">"${escapeHtml(b.text)}"</p>
                        <p class="text-[11px] text-gray-400 text-right font-medium">- ${escapeHtml(b.author)} -</p>
                    </div>
                    <button onclick="removeBookmark('${b.id}')" title="삭제" class="text-amber-500 hover:text-amber-700 p-1">
                        <i class="fa-solid fa-bookmark text-sm"></i>
                    </button>
                `;
                listEl.appendChild(item);
            });
        }

        function removeBookmark(id) {
            bookmarks = bookmarks.filter(b => b.id !== id);
            saveBookmarksToStorage();
            renderBookmarkList();
            updateBookmarkIconState();
            showToast('보관함에서 삭제되었습니다.', 'info');
        }

        // Toast Helper Function
        function showToast(msg, type = 'info') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            const toastIcon = document.getElementById('toastIcon');

            toastMsg.innerText = msg;

            if (type === 'success') {
                toastIcon.className = "fa-solid fa-circle-check text-emerald-400 text-base";
            } else if (type === 'error') {
                toastIcon.className = "fa-solid fa-circle-exclamation text-rose-400 text-base";
            } else {
                toastIcon.className = "fa-solid fa-circle-info text-sky-400 text-base";
            }

            toast.classList.remove('-translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('-translate-y-20', 'opacity-0');
            }, 2200);
        }

        // Escape HTML Security Helper
        function escapeHtml(str) {
            if(!str) return '';
            return str.replace(/&/g, "&amp;")
                      .replace(/</g, "&lt;")
                      .replace(/>/g, "&gt;")
                      .replace(/"/g, "&quot;")
                      .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
