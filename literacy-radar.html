<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>디지털 리터러시 자기평가 레이더 차트</title>
<style>
:root{--bg:#f7f6f2;--card:#fff;--tx:#222;--mu:#6b6b6b;--bd:#e2e0d8;--pre:#2f6fdb;--post:#e0443e;--req:#1f9d55;--ac:#2f4f9d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1c1f;--card:#26272b;--tx:#ececec;--mu:#a0a0a0;--bd:#3a3b40;--ac:#8fb0ff}}
:root[data-theme="dark"]{--bg:#1b1c1f;--card:#26272b;--tx:#ececec;--mu:#a0a0a0;--bd:#3a3b40;--ac:#8fb0ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.5}
main{max-width:1020px;margin:0 auto;padding:20px 16px 40px}
.tag{display:inline-block;background:var(--ac);color:#fff;border-radius:99px;padding:2px 12px;font-size:13px}
h1{font-size:24px;margin:8px 0 4px}
p.sub{color:var(--mu);margin:0 0 16px}
.grid{display:grid;grid-template-columns:1.15fr 1fr;gap:16px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;min-width:0}
h2{font-size:16px;margin:0 0 10px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:5px 3px;text-align:center;border-bottom:1px solid var(--bd);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
input,select{border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:14px;padding:6px;font-family:inherit}
input[type=number]{width:58px;text-align:center}
input.nm{width:130px;text-align:left}
.noreq .rq{display:none}
.pre{color:var(--pre);font-weight:600}.post{color:var(--post);font-weight:600}.rqc{color:var(--req);font-weight:600}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
button{border:1px solid var(--bd);background:var(--bg);color:var(--tx);padding:8px 12px;border-radius:10px;font-size:14px;cursor:pointer;font-family:inherit}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
button.x{padding:4px 8px;color:var(--post)}
.legend{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:8px;font-size:14px}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.cv{background:#fff;border-radius:10px;text-align:center}
canvas,.cv img{max-width:100%;height:auto}
.note{color:var(--mu);font-size:13px;margin:8px 0 0}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px;font-size:14px}
textarea{width:100%;min-height:170px;box-sizing:border-box;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:14px/1.6 inherit;resize:vertical}
</style>
</head>
<body>
<main>
<span class="tag">실습 9</span>
<h1>디지털 리터러시 자기평가 레이더 차트</h1>
<p class="sub">영역별 사전(파란색)·사후(빨간색) 점수를 겹쳐 비교하고, 과목별 필요 역량(초록 점선)과도 견줘 볼 수 있습니다.</p>
<div class="grid">
<section class="card">
<h2>점수 입력 (0~100점)</h2>
<div class="bar">
<label>과목 <select id="subj"></select></label>
<label><input type="checkbox" id="showreq" checked> 필요 역량 표시</label>
</div>
<div class="tw"><table id="tb">
<thead><tr><th>영역</th><th class="pre">사전</th><th class="post">사후</th><th class="rq rqc">필요</th><th>변화</th><th class="rq">부족</th><th></th></tr></thead>
<tbody id="rows"></tbody>
</table></div>
<div class="btns">
<input class="nm" id="newname" placeholder="새 영역 이름" maxlength="20">
<button id="add">+ 영역 추가</button>
</div>
<p class="note" id="warn"></p>
<p class="note">과목을 고르면 필요 역량이 예시 기준값으로 채워지며, '필요' 칸은 자유롭게 수정할 수 있습니다. 기준값은 참고용 예시이니 수업 상황에 맞게 조정하세요.</p>
<div class="btns">
<button id="reset">기본값 복원</button>
<button id="clear">점수 전체 지우기</button>
</div>
</section>
<section class="card">
<h2>레이더 차트</h2>
<div class="cv"><canvas id="cv" width="560" height="560"></canvas></div>
<div class="legend"><span><i class="dot" style="background:var(--pre)"></i>사전 평가</span><span><i class="dot" style="background:var(--post)"></i>사후 평가</span><span id="lgreq"><i class="dot" style="background:var(--req)"></i>필요 역량</span></div>
</section>
</div>
<section class="card" style="margin-top:16px">
<h2>저장 및 분석 요약</h2>
<div class="btns" style="margin:0 0 12px">
<button class="p" id="img">차트 이미지 만들기</button>
<button id="copy">분석 요약 복사</button>
</div>
<div id="imgbox" class="cv" style="display:none;margin-bottom:12px"></div>
<p class="note" id="imgnote" style="display:none;margin:0 0 12px">이미지를 길게 누르거나(모바일) 오른쪽 클릭(PC)하여 저장하세요.</p>
<textarea id="sum" readonly></textarea>
</section>
</main>
<script>
var DEFN=["정보검색 능력","비판적 사고","디지털 도구 활용","협업 능력","창의적 문제해결"];
var DEFPRE=[45,38,52,60,41],DEFPOST=[78,71,85,80,75];
var PRESET={"국어":[80,85,60,70,70],"수학":[65,85,70,65,85],"과학":[80,80,75,75,80],"사회":[85,85,65,80,70],"영어":[80,70,70,75,70],"정보":[75,75,90,80,85]};
var MAX=100,MINA=3,MAXA=10,areas=[];
var rows=document.getElementById('rows'),cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var sumEl=document.getElementById('sum'),warn=document.getElementById('warn'),subj=document.getElementById('subj'),showreq=document.getElementById('showreq');
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}
function defaults(){areas=DEFN.map(function(n,i){return{n:n,pre:DEFPRE[i],post:DEFPOST[i],req:null}});subj.value=''}
function opts(){subj.innerHTML='<option value="">선택 안 함</option>'+Object.keys(PRESET).map(function(k){return'<option>'+k+'</option>'}).join('')+'<option value="__c">직접 입력</option>'}
function build(){
  rows.innerHTML='';
  areas.forEach(function(a,i){
    var tr=document.createElement('tr');
    function num(t,v){return'<input type="number" min="0" max="100" data-t="'+t+'" data-i="'+i+'" value="'+(v===null?'':v)+'">'}
    tr.innerHTML='<td><input class="nm" data-t="n" data-i="'+i+'" value="'+esc(a.n)+'"></td><td>'+num('pre',a.pre)+'</td><td>'+num('post',a.post)+'</td><td class="rq">'+num('req',a.req)+'</td><td id="d'+i+'">-</td><td class="rq" id="g'+i+'">-</td><td><button class="x" data-del="'+i+'" title="삭제">✕</button></td>';
    rows.appendChild(tr);
  });
}
rows.addEventListener('input',function(e){
  var t=e.target.dataset.t,i=e.target.dataset.i;if(t===undefined)return;
  var a=areas[i];
  if(t==='n'){a.n=e.target.value.trim()||('영역'+(Number(i)+1))}
  else{
    var v=e.target.value;
    if(v===''){a[t]=null}else{var n=Math.max(0,Math.min(MAX,Number(v)));a[t]=n;if(n!==Number(v))e.target.value=n}
    if(t==='req')subj.value='__c';
  }
  update();
});
rows.addEventListener('click',function(e){
  var d=e.target.dataset.del;if(d===undefined)return;
  if(areas.length<=MINA){warn.textContent='영역은 최소 '+MINA+'개가 필요합니다.';return}
  areas.splice(Number(d),1);build();update();
});
document.getElementById('add').onclick=function(){
  var inp=document.getElementById('newname'),nm=inp.value.trim();
  if(!nm){warn.textContent='추가할 영역 이름을 입력하세요.';inp.focus();return}
  if(areas.length>=MAXA){warn.textContent='영역은 최대 '+MAXA+'개까지 추가할 수 있습니다.';return}
  areas.push({n:nm,pre:null,post:null,req:null});inp.value='';build();update();
};
subj.onchange=function(){
  var p=PRESET[subj.value];if(!p&&subj.value!=='')return;
  areas.forEach(function(a){
    var k=DEFN.indexOf(a.n);
    if(subj.value==='')a.req=null;else if(p&&k>=0)a.req=p[k];
  });
  if(subj.value!=='')showreq.checked=true;
  build();update();
};
showreq.onchange=update;
function v0(x){return x===null?0:x}
function pt(i,v,cx,cy,r){var ang=-Math.PI/2+i*2*Math.PI/areas.length;return[cx+r*v/MAX*Math.cos(ang),cy+r*v/MAX*Math.sin(ang)]}
function poly(key,color,fillc,dash,cx,cy,r){
  ctx.beginPath();
  areas.forEach(function(a,i){var p=pt(i,v0(a[key]),cx,cy,r);i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])});
  ctx.closePath();if(fillc){ctx.fillStyle=fillc;ctx.fill()}
  ctx.setLineDash(dash||[]);ctx.lineWidth=2.5;ctx.strokeStyle=color;ctx.stroke();ctx.setLineDash([]);
  areas.forEach(function(a,i){
    if(a[key]===null)return;
    var p=pt(i,a[key],cx,cy,r);ctx.beginPath();ctx.arc(p[0],p[1],4,0,7);ctx.fillStyle=color;ctx.fill();
  });
}
function reqOn(){return showreq.checked&&areas.some(function(a){return a.req!==null})}
function draw(){
  var W=cv.width,H=cv.height,cx=W/2,cy=H/2+4,r=165,n=areas.length;
  ctx.clearRect(0,0,W,H);ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
  ctx.font='12px sans-serif';ctx.textAlign='center';
  for(var k=1;k<=5;k++){
    ctx.beginPath();
    for(var i=0;i<n;i++){var p=pt(i,MAX*k/5,cx,cy,r);i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])}
    ctx.closePath();ctx.strokeStyle='#d8d8d8';ctx.lineWidth=1;ctx.stroke();
    ctx.fillStyle='#999';ctx.fillText(MAX*k/5,cx+10,cy-r*k/5+4);
  }
  for(var i=0;i<n;i++){var p=pt(i,MAX,cx,cy,r);ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(p[0],p[1]);ctx.strokeStyle='#d8d8d8';ctx.stroke()}
  var ro=reqOn();
  if(ro)poly('req','#1f9d55','rgba(31,157,85,.08)',[7,5],cx,cy,r);
  poly('pre','#2f6fdb','rgba(47,111,219,.22)',null,cx,cy,r);
  poly('post','#e0443e','rgba(224,68,62,.22)',null,cx,cy,r);
  for(var i=0;i<n;i++){
    var q=pt(i,MAX*1.18,cx,cy,r),a=areas[i];
    ctx.font='bold 14px sans-serif';ctx.fillStyle='#222';ctx.fillText(a.n,q[0],q[1]);
    ctx.font='12px sans-serif';
    ctx.fillStyle='#2f6fdb';ctx.fillText(a.pre===null?'-':a.pre,q[0]-(ro?24:16),q[1]+16);
    ctx.fillStyle='#e0443e';ctx.fillText(a.post===null?'-':a.post,q[0]+(ro?0:16),q[1]+16);
    if(ro){ctx.fillStyle='#1f9d55';ctx.fillText(a.req===null?'-':a.req,q[0]+24,q[1]+16)}
  }
  ctx.font='bold 15px sans-serif';ctx.fillStyle='#222';ctx.textAlign='left';
  ctx.fillText('디지털 리터러시 자기평가'+(subj.value&&PRESET[subj.value]?' · '+subj.value+' 과목':''),14,24);
  var x=14,y=H-18;
  ctx.fillStyle='#2f6fdb';ctx.fillText('● 사전',x,y);ctx.fillStyle='#e0443e';ctx.fillText('● 사후',x+60,y);
  if(ro){ctx.fillStyle='#1f9d55';ctx.fillText('┄ 필요 역량',x+120,y)}
  ctx.textAlign='center';
}
function avg(k){var s=0;areas.forEach(function(a){s+=v0(a[k])});return s/areas.length}
function sg(x){return(x>0?'+':'')+x}
function summary(){
  var n=areas.length,d=areas.map(function(a){return v0(a.post)-v0(a.pre)});
  var mx=0,mn=0,lo=0,hi=0;
  areas.forEach(function(a,i){if(d[i]>d[mx])mx=i;if(d[i]<d[mn])mn=i;if(v0(a.post)<v0(areas[lo].post))lo=i;if(v0(a.post)>v0(areas[hi].post))hi=i});
  var miss=areas.filter(function(a){return a.pre===null||a.post===null}).map(function(a){return a.n});
  var L=['[디지털 리터러시 자기평가 분석 요약]'+(subj.value&&PRESET[subj.value]?' - '+subj.value+' 과목':''),
   '- 사전 평균 '+avg('pre').toFixed(1)+'점 → 사후 평균 '+avg('post').toFixed(1)+'점 ('+sg(+(avg('post')-avg('pre')).toFixed(1))+'점)',
   '- 가장 크게 성장한 영역: '+areas[mx].n+' ('+sg(d[mx])+'점)',
   '- 성장폭이 가장 작은 영역: '+areas[mn].n+' ('+sg(d[mn])+'점)',
   '- 사후 최고 영역: '+areas[hi].n+' ('+v0(areas[hi].post)+'점), 사후 최저(보완 필요) 영역: '+areas[lo].n+' ('+v0(areas[lo].post)+'점)',''];
  var ro=reqOn();
  areas.forEach(function(a,i){
    var s='· '+a.n+': '+(a.pre===null?'-':a.pre)+' → '+(a.post===null?'-':a.post)+' ('+sg(d[i])+')';
    if(ro&&a.req!==null)s+=' / 필요 '+a.req+'점'+(v0(a.post)>=a.req?' 충족':' (부족 '+(a.req-v0(a.post))+'점)');
    L.push(s);
  });
  if(ro){
    var sh=areas.filter(function(a){return a.req!==null&&v0(a.post)<a.req}).map(function(a){return a.n});
    L.push('','- 필요 역량 대비: '+(sh.length?'사후 점수가 기준에 못 미치는 영역은 '+sh.join(', ')+'입니다.':'모든 영역이 필요 역량 기준을 충족했습니다.'));
  }
  if(miss.length)L.push('','※ 미입력 점수는 0점으로 계산됨: '+miss.join(', '));
  return L.join('\n');
}
function update(){
  var ro=showreq.checked;
  document.getElementById('tb').className=ro?'':'noreq';
  document.getElementById('lgreq').style.display=reqOn()?'':'none';
  areas.forEach(function(a,i){
    var dv=v0(a.post)-v0(a.pre),el=document.getElementById('d'+i),g=document.getElementById('g'+i);
    if(!el)return;
    el.textContent=sg(dv);el.style.color=dv>=0?'var(--post)':'var(--pre)';
    if(a.req===null){g.textContent='-';g.style.color=''}
    else{var gap=a.req-v0(a.post);g.textContent=gap>0?gap:'충족';g.style.color=gap>0?'var(--post)':'var(--req)'}
  });
  var any=areas.some(function(a){return a.pre===null||a.post===null});
  warn.textContent=any?'비어 있는 점수 칸은 0점으로 표시됩니다.':'';
  draw();sumEl.value=summary();
}
document.getElementById('reset').onclick=function(){defaults();showreq.checked=true;build();update()};
document.getElementById('clear').onclick=function(){areas.forEach(function(a){a.pre=null;a.post=null});build();update()};
document.getElementById('img').onclick=function(){
  var b=document.getElementById('imgbox');b.innerHTML='';
  var im=new Image();im.src=cv.toDataURL('image/png');im.alt='레이더 차트';b.appendChild(im);
  b.style.display='block';document.getElementById('imgnote').style.display='block';
};
document.getElementById('copy').onclick=function(){
  var b=this;sumEl.select();
  try{navigator.clipboard.writeText(sumEl.value).then(function(){b.textContent='복사됨!'},function(){document.execCommand('copy');b.textContent='복사됨!'})}
  catch(e){try{document.execCommand('copy');b.textContent='복사됨!'}catch(x){}}
  setTimeout(function(){b.textContent='분석 요약 복사'},1500);
};
opts();defaults();build();update();
</script>
</body>
</html>
