<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>시작 홈페이지</title>
<style>
  :root {
    --bg: #F7F7F4;
    --ink: #1D1D1B;
    --muted: #8A8A82;
    --line: #DEDDD5;
    --accent: #3D5A50;
    --accent-soft: #E7ECE9;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", "Apple SD Gothic Neo", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 32px 20px;
  }

  main {
    width: 100%;
    max-width: 560px;
    display: flex;
    flex-direction: column;
    gap: 44px;
  }

  /* ---------- 시계 ---------- */
  .clock-block {
    text-align: center;
  }

  #time {
    font-size: 76px;
    font-weight: 600;
    letter-spacing: -2px;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }

  #date {
    margin-top: 10px;
    font-size: 16px;
    color: var(--muted);
    font-weight: 400;
  }

  /* ---------- 검색 ---------- */
  .search-form {
    display: flex;
    align-items: center;
    gap: 12px;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 14px 20px;
    background: #FFFFFF;
    transition: border-color 0.15s ease;
  }

  .search-form:focus-within {
    border-color: var(--accent);
  }

  .search-form svg {
    flex-shrink: 0;
    color: var(--muted);
  }

  .search-form input {
    flex: 1;
    border: none;
    outline: none;
    font-size: 16px;
    font-family: inherit;
    color: var(--ink);
    background: transparent;
  }

  .search-form input::placeholder {
    color: var(--muted);
  }

  .search-submit {
    flex-shrink: 0;
    border: none;
    background: var(--accent);
    color: #fff;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .search-submit:hover {
    opacity: 0.9;
  }

  /* ---------- 할일 ---------- */
  .todo-block {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .todo-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 14px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--line);
  }

  .todo-header h2 {
    font-size: 15px;
    font-weight: 600;
    margin: 0;
    color: var(--ink);
  }

  .todo-count {
    font-size: 13px;
    color: var(--muted);
  }

  .todo-add {
    display: flex;
    gap: 10px;
    margin-bottom: 6px;
  }

  .todo-add input {
    flex: 1;
    border: none;
    border-bottom: 1px solid var(--line);
    padding: 8px 2px;
    font-size: 15px;
    font-family: inherit;
    color: var(--ink);
    background: transparent;
    outline: none;
  }

  .todo-add input::placeholder {
    color: var(--muted);
  }

  .todo-add input:focus {
    border-bottom-color: var(--accent);
  }

  .todo-add button {
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    font-weight: 500;
    padding: 0 18px;
    border-radius: 8px;
    cursor: pointer;
  }

  .todo-add button:hover {
    opacity: 0.9;
  }

  #todo-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .todo-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 2px;
    border-bottom: 1px solid var(--line);
  }

  .todo-item:last-child {
    border-bottom: none;
  }

  .todo-check {
    width: 18px;
    height: 18px;
    border: 1.5px solid var(--muted);
    border-radius: 50%;
    flex-shrink: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    padding: 0;
  }

  .todo-check.checked {
    background: var(--accent);
    border-color: var(--accent);
  }

  .todo-check.checked::after {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #fff;
  }

  .todo-text {
    flex: 1;
    font-size: 15px;
    word-break: break-word;
  }

  .todo-item.done .todo-text {
    color: var(--muted);
    text-decoration: line-through;
  }

  .todo-remove {
    border: none;
    background: none;
    color: var(--muted);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    padding: 4px;
    opacity: 0;
    transition: opacity 0.1s ease;
  }

  .todo-item:hover .todo-remove {
    opacity: 1;
  }

  .todo-empty {
    padding: 24px 2px;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
  }

  @media (max-width: 480px) {
    #time { font-size: 56px; }
    main { gap: 36px; }
  }
</style>
</head>
<body>

<main>

  <section class="clock-block">
    <div id="time">00:00</div>
    <div id="date">-</div>
  </section>

  <form class="search-form" id="search-form" action="https://www.google.com/search" method="GET">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="7"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
    <input type="text" id="search-input" name="q" placeholder="Google 검색" autocomplete="off" autofocus>
    <button type="submit" class="search-submit" aria-label="검색">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="5" y1="12" x2="19" y2="12"></line>
        <polyline points="12 5 19 12 12 19"></polyline>
      </svg>
    </button>
  </form>

  <section class="todo-block">
    <div class="todo-header">
      <h2>오늘의 할일</h2>
      <span class="todo-count" id="todo-count"></span>
    </div>

    <div class="todo-add">
      <input type="text" id="todo-input" placeholder="할일을 입력하고 Enter" autocomplete="off">
      <button id="todo-add-btn" type="button">추가</button>
    </div>

    <ul id="todo-list"></ul>
  </section>

</main>

<script>
  // ---------- 시계 ----------
  function updateClock() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2, '0');
    const m = String(now.getMinutes()).padStart(2, '0');
    const s = String(now.getSeconds()).padStart(2, '0');
    document.getElementById('time').textContent = `${h}:${m}:${s}`;

    const days = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];
    const dateStr = `${now.getFullYear()}년 ${now.getMonth() + 1}월 ${now.getDate()}일 ${days[now.getDay()]}`;
    document.getElementById('date').textContent = dateStr;
  }
  updateClock();
  setInterval(updateClock, 1000);

  // ---------- 검색 ----------
  const searchForm = document.getElementById('search-form');
  const searchInput = document.getElementById('search-input');

  searchForm.addEventListener('submit', function (e) {
    const query = searchInput.value.trim();
    if (!query) {
      e.preventDefault();
      return;
    }
    // 폼의 기본 제출 대신 직접 새 창으로 열어, 미리보기 환경 등
    // 현재 창 이동이 막힌 환경에서도 검색이 확실히 동작하도록 처리합니다.
    e.preventDefault();
    const url = 'https://www.google.com/search?q=' + encodeURIComponent(query);
    const newWin = window.open(url, '_blank');
    if (!newWin) {
      // 새 창이 차단된 경우 현재 창에서 이동
      window.location.href = url;
    }
  });

  // ---------- 할일 ----------
  const STORAGE_KEY = 'my-homepage-todos';
  const listEl = document.getElementById('todo-list');
  const inputEl = document.getElementById('todo-input');
  const addBtn = document.getElementById('todo-add-btn');
  const countEl = document.getElementById('todo-count');

  function loadTodos() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch (e) {
      return [];
    }
  }

  function saveTodos(todos) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
  }

  function render() {
    const todos = loadTodos();
    listEl.innerHTML = '';

    if (todos.length === 0) {
      const empty = document.createElement('li');
      empty.className = 'todo-empty';
      empty.textContent = '할일이 없습니다. 위에 입력해보세요.';
      listEl.appendChild(empty);
      countEl.textContent = '';
      return;
    }

    const doneCount = todos.filter(t => t.done).length;
    countEl.textContent = `${doneCount} / ${todos.length}`;

    todos.forEach((todo, idx) => {
      const li = document.createElement('li');
      li.className = 'todo-item' + (todo.done ? ' done' : '');

      const check = document.createElement('button');
      check.className = 'todo-check' + (todo.done ? ' checked' : '');
      check.type = 'button';
      check.addEventListener('click', () => {
        const t = loadTodos();
        t[idx].done = !t[idx].done;
        saveTodos(t);
        render();
      });

      const text = document.createElement('span');
      text.className = 'todo-text';
      text.textContent = todo.text;

      const remove = document.createElement('button');
      remove.className = 'todo-remove';
      remove.type = 'button';
      remove.textContent = '✕';
      remove.addEventListener('click', () => {
        const t = loadTodos();
        t.splice(idx, 1);
        saveTodos(t);
        render();
      });

      li.appendChild(check);
      li.appendChild(text);
      li.appendChild(remove);
      listEl.appendChild(li);
    });
  }

  function addTodo() {
    const value = inputEl.value.trim();
    if (!value) return;
    const todos = loadTodos();
    todos.push({ text: value, done: false });
    saveTodos(todos);
    inputEl.value = '';
    render();
  }

  addBtn.addEventListener('click', addTodo);
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addTodo();
  });

  render();
</script>

</body>
</html>
